[package]
name = "prosaic-grammar-es"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Spanish grammar layer for the Prosaic NLG engine"
readme = "README.md"

[dependencies]
prosaic-core = { version = "1.0.1", path = "../prosaic-core", default-features = false }

[dev-dependencies]
prosaic-grammar-es = { path = ".", features = ["time"] }

[features]
# Enable the `since_last_marker` Language override and the time-related
# test helpers. Requires prosaic-core's `time` feature to be active.
time = ["prosaic-core/time"]
