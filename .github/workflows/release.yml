name: Binary Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package, for example v0.6.2.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: binary-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Package binary
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $tag.TrimStart("v")
          ./scripts/package-binary.ps1 -Version $version -TargetTriple "${{ matrix.target }}"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: prosaic-${{ matrix.target }}
          path: target/dist/prosaic-*
          if-no-files-found: error

  release:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          path: target/dist
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: |
          cd target/dist
          sha256sum -c ./*.sha256

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" target/dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" target/dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --generate-notes
          fi
