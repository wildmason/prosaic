[package]
name = "prosaic-grammar-de"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "German grammar layer for the Prosaic NLG engine"

[dependencies]
prosaic-core = { version = "0.6.1", path = "../prosaic-core", default-features = false }

[dev-dependencies]
prosaic-grammar-de = { version = "0.6.1", path = ".", features = ["time"] }

[features]
# Enable the `since_last_marker` Language override and the time-related
# test helpers. Requires prosaic-core's `time` feature to be active.
time = ["prosaic-core/time"]
