[package]
name = "prosaic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line front-end to the prosaic crate: JSON-lines events in, rendered text out"

[[bin]]
name = "prosaic"
path = "src/main.rs"

[dependencies]
prosaic-core = { version = "0.6.1", path = "../prosaic-core", features = ["serde"] }
prosaic-grammar-en = { version = "0.6.1", path = "../prosaic-grammar-en" }
prosaic-vocab-code = { version = "0.6.1", path = "../prosaic-vocab-code" }
prosaic-vocab-git = { version = "0.6.1", path = "../prosaic-vocab-git" }
prosaic-vocab-release = { version = "0.6.1", path = "../prosaic-vocab-release" }
prosaic-vocab-pr = { version = "0.6.1", path = "../prosaic-vocab-pr" }
prosaic-project = { version = "0.6.1", path = "../prosaic-project" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
