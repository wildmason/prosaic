[package]
name = "prosaic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "General-purpose natural language generation from structured data"

[dependencies]
ahash = { version = "0.8", default-features = false, features = ["compile-time-rng"] }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
thiserror = { version = "2", default-features = false }
itoa = { version = "1", default-features = false }
prosaic-common = { version = "1.0.0", path = "../prosaic-common", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }
rayon = { version = "1", optional = true }

[features]
default = ["std", "time", "polish", "reg"]

# Enables `SystemTime::now()` fallbacks, `impl std::error::Error for ProsaicError`,
# and `serde/std`. Without this feature the library is `no_std + alloc`-compatible:
# `Variation::Random` degrades to variant 0, and temporal pipes require an explicit
# `engine.reference_time()`.
std = ["ahash/std", "thiserror/std", "serde?/std"]

# Optional serde Serialize/Deserialize on Context, Value, EntityDescriptor,
# RenderExplanation, VariantScore, and all configuration enums — enables
# sending engine artefacts across JSON/MessagePack/etc. boundaries.
serde = ["dep:serde", "dep:serde_json", "ahash/serde", "hashbrown/serde"]

# Relative-time pipe (`{ts|relative}`) and `engine.reference_time()`.
# When disabled, the `relative` pipe is not registered and attempting
# to use it in a template returns an `InvalidPipe` error at render
# time. `SystemTime::now()` is also not referenced, so this feature
# must be disabled for WASM targets that lack system time.
time = ["std"]

# Post-processing polish passes: smart quotes (`engine.smart_quotes`)
# and sentence-length budgeting (`engine.max_sentence_length`). When
# disabled, the corresponding builder methods are unavailable.
polish = []

# Parallel rendering of DocumentPlan paragraphs via rayon. Each paragraph
# gets its own cloned Session. Temporal-anchor threading across paragraphs
# is lost — each paragraph anchors independently. Requires the `std` feature.
parallel = ["dep:rayon", "std"]

# Referring-expression generation (Dale & Reiter): entity registry,
# attribute preference order, and the same-type distractor walk inside
# `{name|refer}`. When disabled, Full-form references render without
# disambiguating attributes even when multiple same-type entities are
# known. The bare `refer` pipe still produces Full/Short/Pronoun forms
# from discourse state.
reg = []

[dev-dependencies]
prosaic-derive = { path = "../prosaic-derive" }
prosaic-grammar-en = { path = "../prosaic-grammar-en" }
prosaic-vocab-code = { path = "../prosaic-vocab-code" }
proptest = "1"
serde_json = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
trybuild = "1"

[[bench]]
name = "engine"
harness = false
