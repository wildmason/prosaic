[package]
name = "prosaic-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the Prosaic NLG engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prosaic-core = { version = "1.0.0", path = "../prosaic-core", default-features = false, features = ["std", "polish", "reg", "serde"] }
prosaic-grammar-en = { version = "1.0.0", path = "../prosaic-grammar-en" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = { version = "1", default-features = false, features = ["std"] }
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
