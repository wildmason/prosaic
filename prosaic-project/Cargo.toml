[package]
name = "prosaic-project"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Folder-of-files project format and bundler for Prosaic templates."

[dependencies]
prosaic-core = { version = "0.6.1", path = "../prosaic-core", default-features = false, features = ["std", "serde"] }
prosaic-grammar-en = { version = "0.6.1", path = "../prosaic-grammar-en" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
prosaic-grammar-es = { version = "0.6.1", path = "../prosaic-grammar-es" }
prosaic-grammar-de = { version = "0.6.1", path = "../prosaic-grammar-de" }
